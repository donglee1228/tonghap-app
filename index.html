<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c2230" />
  <title>옷싹 · 바람막이·아웃도어팬츠·빅사이즈 비교</title>
  <meta name="description" content="바람막이·아웃도어팬츠·빅사이즈 가격/별점 한눈에 비교" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🧥</span>
      <div class="brand-text">
        <h1>옷싹</h1>
        <p class="subtitle">바람막이·아웃도어팬츠·빅사이즈 가격/별점 한눈에 비교</p>
      </div>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" inputmode="search" placeholder="🔍 상품명으로 찾아보기" autocomplete="off" />
    </div>
  </header>

  <nav class="filters" aria-label="필터">
    <div class="filter-group">
      <label>카테고리</label>
      <div class="chips" id="filter-category"></div>
    </div>
    <div class="filter-group">
      <label>성별</label>
      <div class="chips" id="filter-gender"></div>
    </div>
    <div class="filter-group">
      <label>가격대</label>
      <div class="chips" id="filter-price"></div>
    </div>
    <div class="filter-group">
      <label>쇼핑몰</label>
      <div class="chips" id="filter-mall"></div>
    </div>
    <div class="filter-group">
      <label>정렬</label>
      <div class="chips" id="filter-sort"></div>
    </div>
  </nav>

  <div class="count-bar">
    <span id="count">불러오는 중...</span>
    <button id="reset" class="reset-btn" type="button">필터 초기화</button>
  </div>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer class="footer">
    <p>옷싹 · 가격은 변동될 수 있어요. 구매 전 다시 확인해주세요 🙏</p>
  </footer>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
